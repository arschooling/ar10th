<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아르스쿨링 10주년 초대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:radial-gradient(120% 80% at 50% 0%, #14110d, #0a0807 70%);
    color:#efe7d8;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:40px;padding:48px 20px;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:#e3bd6e;text-transform:uppercase;}
  h1{
    font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:32px;line-height:1.45;
    letter-spacing:.01em;
  }
  h1 .g{
    background:linear-gradient(180deg,#f4d99a,#b8852f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;}
  a.card{
    display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
    width:240px;height:128px;text-decoration:none;
    border:1px solid rgba(227,189,110,.34);border-radius:8px;
    color:#efe7d8;transition:all .25s ease;background:rgba(227,189,110,.04);
  }
  a.card:hover{border-color:#e3bd6e;background:rgba(227,189,110,.1);transform:translateY(-3px);}
  a.card .name{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:22px;color:#f4d99a;}
  a.card .sub{font-size:12.5px;letter-spacing:.04em;color:#b7ac98;font-weight:300;}
  .foot{font-size:12px;color:#7d735f;letter-spacing:.04em;}
</style>
</head>
<body>
  <div class="eyebrow">Homecoming · 2026</div>
  <h1>아르스쿨링 <span class="g">10주년</span> &amp; 바오로장학회 <span class="g">홈커밍</span><br>초대장</h1>
  <div class="cards">
    <a class="card" href="dark.html">
      <span class="name">다크 버전</span>
      <span class="sub">Black &amp; Gold</span>
    </a>
    <a class="card" href="cream.html">
      <span class="name">크림 버전</span>
      <span class="sub">Cream &amp; Gold</span>
    </a>
  </div>
  <div class="foot">6월 21일 (일) 오후 2시 · 강하공소</div>
</body>
</html>
